<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tactics</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin: 32px;
        font-family: system-ui, sans-serif;
        background: #1f2937;
        color: #f9fafb;
      }
      canvas {
        border: 1px solid #4b5563;
        image-rendering: pixelated;
      }
      /* align-items: flex-end pins the panel to the bottom of the board, so it
         sits at the bottom-right of the play area. */
      #stage {
        display: flex;
        align-items: flex-end;
        gap: 16px;
      }
      #action-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 140px;
        padding: 10px;
        border: 1px solid #4b5563;
        border-radius: 4px;
        background: #111827;
      }
      #action-panel .panel-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9ca3af;
      }
      #action-panel .panel-hint {
        font-size: 12px;
        line-height: 1.35;
        color: #9ca3af;
        min-height: 3.2em;
      }
      #action-panel button {
        font: inherit;
        font-size: 14px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #action-panel button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      #controls button {
        font: inherit;
        padding: 6px 14px;
        margin-right: 8px;
        cursor: pointer;
      }
      #replay-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 512px;
      }
      #replay-text {
        font-family: monospace;
        font-size: 12px;
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        resize: vertical;
      }
      #import-error {
        color: #f87171;
        font-size: 13px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="action-panel">
        <div class="panel-title">Actions</div>
        <div class="panel-hint" id="action-hint">Select a unit</div>
        <button id="merge-btn" disabled>Merge</button>
      </div>
    </div>
    <div id="controls">
      <button id="end-turn">End turn</button>
      <button id="new-game">New game</button>
      <button id="export-btn">Export</button>
      <button id="import-btn">Import</button>
    </div>
    <div id="replay-panel">
      <textarea id="replay-text" placeholder="Export fills this with JSON; paste JSON here and click Import to load it."></textarea>
      <div id="import-error"></div>
    </div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>

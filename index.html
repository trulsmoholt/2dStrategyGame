<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tactics</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin: 32px;
        font-family: system-ui, sans-serif;
        background: #1f2937;
        color: #f9fafb;
      }
      canvas {
        border: 1px solid #4b5563;
        image-rendering: pixelated;
      }
      #controls button {
        font: inherit;
        padding: 6px 14px;
        margin-right: 8px;
        cursor: pointer;
      }
      #replay-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 512px;
      }
      #replay-text {
        font-family: monospace;
        font-size: 12px;
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        resize: vertical;
      }
      #import-error {
        color: #f87171;
        font-size: 13px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div id="controls">
      <button id="end-turn">End turn</button>
      <button id="new-game">New game</button>
      <button id="export-btn">Export</button>
      <button id="import-btn">Import</button>
    </div>
    <div id="replay-panel">
      <textarea id="replay-text" placeholder="Export fills this with JSON; paste JSON here and click Import to load it."></textarea>
      <div id="import-error"></div>
    </div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
